<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ether OS — Executive Booth & Card QR</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&family=Cinzel:wght@700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'JetBrains Mono', monospace;
            background: #040711;
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            padding: 24px 16px;
            text-align: center;
        }

        .logo-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-mark {
            width: 34px;
            height: 34px;
            background: linear-gradient(135deg, #00f0ff, #0077ff);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 800;
            color: #000;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
        }

        .logo-name {
            font-size: 17px;
            font-weight: 800;
            letter-spacing: 0.24em;
            color: #00f0ff;
        }

        .toggle-container {
            display: flex;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 30px;
            padding: 4px;
            gap: 4px;
            max-width: 360px;
            width: 100%;
        }

        .toggle-btn {
            flex: 1;
            padding: 10px 14px;
            border-radius: 25px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            font-weight: 700;
            border: none;
            background: transparent;
            color: #94a3b8;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .toggle-btn.active {
            background: linear-gradient(135deg, #00f0ff 0%, #0077ff 100%);
            color: #000;
            font-weight: 800;
            box-shadow: 0 4px 14px rgba(0, 240, 255, 0.35);
        }

        .qr-outer {
            background: #ffffff;
            border-radius: 18px;
            padding: 18px;
            box-shadow:
                0 0 0 1px rgba(0, 240, 255, 0.3),
                0 0 50px rgba(0, 240, 255, 0.18),
                0 25px 70px rgba(0, 0, 0, 0.85);
            transition: transform 0.2s ease;
        }

        #master-qr canvas,
        #master-qr img {
            display: block;
            margin: 0 auto;
        }

        .action-title {
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 0.12em;
            color: #00f0ff;
            text-transform: uppercase;
        }

        .action-subtitle {
            font-size: 10px;
            color: #64748b;
            letter-spacing: 0.05em;
            max-width: 320px;
            line-height: 1.4;
        }

        .url-box {
            font-size: 9px;
            color: #38bdf8;
            background: rgba(0, 240, 255, 0.08);
            border: 1px dashed rgba(0, 240, 255, 0.3);
            border-radius: 6px;
            padding: 6px 12px;
            letter-spacing: 0.06em;
            word-break: break-all;
        }

        .footer-note {
            font-size: 9px;
            color: #475569;
            letter-spacing: 0.05em;
        }
    </style>
</head>
<body>

    <div class="logo-row">
        <div class="logo-mark">⚡</div>
        <span class="logo-name">ETHER SOVEREIGN</span>
    </div>

    <!-- Mode Selector -->
    <div class="toggle-container">
        <button class="toggle-btn active" id="btnSign" onclick="switchMode('sign')">⚡ Sign Directive</button>
        <button class="toggle-btn" id="btnPortal" onclick="switchMode('portal')">🌐 Main Portal</button>
    </div>

    <!-- QR Code Container -->
    <div class="qr-outer">
        <div id="master-qr"></div>
    </div>

    <!-- Dynamic Instruction Text -->
    <div class="action-title" id="action-title">Scan to Sign 30-Day Pilot Directive</div>
    <div class="action-subtitle" id="action-subtitle">Point phone camera to execute digital directive on the glass via your phone's cellular connection.</div>
    <div class="url-box" id="url-display">https://ether-terminal.com/sign</div>

    <div class="footer-note">Ēther Terminal LLC • Office of Sovereign Protocol Operations</div>

<script>
    var currentMode = 'sign';
    var qrCodeInstance = null;

    var MODES = {
        sign: {
            url: 'https://ether-terminal.com/sign',
            title: 'Scan to Sign 30-Day Pilot Directive',
            subtitle: 'Point phone camera to execute digital directive on the glass via your phone\'s cellular connection.'
        },
        portal: {
            url: 'https://ether-terminal.com',
            title: 'Scan to View Sovereign Portal & Specs',
            subtitle: 'Directs phone browser to full architecture, benchmarks, and licensing specs.'
        }
    };

    function renderQR(url) {
        var container = document.getElementById('master-qr');
        container.innerHTML = '';
        qrCodeInstance = new QRCode(container, {
            text: url,
            width: 230,
            height: 230,
            colorDark: '#040711',
            colorLight: '#ffffff',
            correctLevel: QRCode.CorrectLevel.H
        });
    }

    function switchMode(mode) {
        currentMode = mode;
        var cfg = MODES[mode];

        document.getElementById('btnSign').className = 'toggle-btn' + (mode === 'sign' ? ' active' : '');
        document.getElementById('btnPortal').className = 'toggle-btn' + (mode === 'portal' ? ' active' : '');

        document.getElementById('action-title').textContent = cfg.title;
        document.getElementById('action-subtitle').textContent = cfg.subtitle;
        document.getElementById('url-display').textContent = cfg.url;

        renderQR(cfg.url);
    }

    // Initial render
    renderQR(MODES.sign.url);
</script>

</body>
</html>
